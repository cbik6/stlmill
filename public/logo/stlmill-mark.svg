<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="t">
  <title id="t">STLmill</title>
  <!-- Stone: circle with a square "eye" cut out (even-odd hole, background shows through) -->
  <path fill="currentColor" fill-rule="evenodd" d="M60 8a52 52 0 1 1 0 104a52 52 0 1 1 0-104zM50 50v20h20V50z"/>
