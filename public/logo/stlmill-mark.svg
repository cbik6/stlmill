  <g stroke="#F07A2A" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="60" y1="78" x2="60" y2="104"/>
    <line x1="42" y1="60" x2="16" y2="60"/>
    <line x1="78" y1="60" x2="104" y2="60"/>
    <line x1="47" y1="73" x2="29" y2="91"/>
    <line x1="73" y1="73" x2="91" y2="91"/>
    <line x1="47" y1="47" x2="29" y2="29"/>
    <line x1="73" y1="47" x2="91" y2="29"/>
  </g>
  <!-- Facet: one STL triangle, the part being made -->
  <path fill="#F07A2A" d="M31 13.4A52 52 0 0 1 89 13.4L60 40z"/>
</svg>
